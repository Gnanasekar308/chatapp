<style>

html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Tamil",sans-serif;display:flex;flex-direction:column}
header{background:var(--hd);color:#fff;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:#6b7c85;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px}
.ti{flex:1;line-height:1.25;font-weight:600;min-width:0}.ti small{display:block;font-weight:400;opacity:.85;font-size:12px}
header b{cursor:pointer;font-size:20px;font-weight:400}
#msgs{flex:1;overflow-y:auto;padding:10px 6%;display:flex;flex-direction:column;gap:3px}
.m{max-width:80%;padding:6px 9px 4px;border-radius:8px;background:var(--in);align-self:flex-start;box-shadow:0 1px .5px rgba(0,0,0,.13);white-space:pre-wrap;word-wrap:break-word;cursor:pointer}
.m.me{background:var(--out);align-self:flex-end}
.m img.pic{display:block;max-width:100%;max-height:260px;border-radius:6px;margin-bottom:3px;cursor:zoom-in}
.ph{color:var(--mute);font-size:13px}
.rq{border-left:3px solid var(--send);background:rgba(128,128,128,.14);border-radius:4px;padding:3px 7px;margin-bottom:4px;font-size:13px;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rq b{display:block;color:var(--send);font-weight:600}
.tm{font-size:11px;color:var(--mute);text-align:right;margin-top:2px;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.tk{font-size:12px;letter-spacing:-2px}.tk.seen{color:#53bdeb}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.red{background:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.18)}
.dot.yellow{background:#f4b400;box-shadow:0 0 0 2px rgba(244,180,0,.18)}
.dt{align-self:center;background:var(--in);color:var(--mute);font-size:12px;padding:4px 10px;border-radius:8px;margin:8px 0;box-shadow:0 1px .5px rgba(0,0,0,.13)}
#rp{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-top:1px solid rgba(128,128,128,.25);font-size:13px}
#rp div{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--mute)}
#rp span{cursor:pointer;font-size:18px}
#bar{display:flex;gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--card);align-items:center}
input{padding:11px 16px;border-radius:22px;border:0;background:var(--inp);color:var(--text);font-size:16px;outline:0}
#t{flex:1;min-width:0}
button{border:0;border-radius:22px;padding:10px 18px;background:var(--send);color:#fff;font-size:16px;cursor:pointer}
#s,#sc,#at{width:44px;height:44px;padding:0;border-radius:50%;font-size:18px;flex:none}
#sc,#at{background:#6b7c85}
#login{margin:auto;display:flex;flex-direction:column;gap:12px;width:min(300px,85%);text-align:center}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#inc{display:none;position:fixed;top:0;left:0;right:0;z-index:8;background:#16a34a;color:#fff;padding:12px;align-items:center;justify-content:space-between}
#inc button{background:#fff;color:#111;margin-left:8px}
#vid{display:none;position:fixed;inset:0;background:#000;z-index:9;flex-direction:column}
#rv{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#lv{position:absolute;right:10px;top:10px;width:110px;border-radius:10px;border:2px solid #fff}
#ctl{display:flex;justify-content:center;gap:14px;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#ctl button{background:#374151}#ctl .red{background:#dc2626}
#login input{width:100%;box-sizing:border-box;border:1px solid var(--mute)}
#login button{width:100%}
#login label{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;justify-content:center}
#login input[type=checkbox]{width:18px;height:18px;padding:0;border:0}
#lf,#sp{display:none;flex-direction:column;gap:12px}
#fg{color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline}
#sch,#cpw{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;align-items:center;justify-content:center}
#sch>div,#cpw>div{background:var(--card);padding:18px;border-radius:12px;display:flex;flex-direction:column;gap:12px;width:min(320px,88%)}
.m.sd{opacity:.85;border:1px dashed var(--mute)}
#cpw input,#sch input{width:100%;box-sizing:border-box;border:1px solid var(--mute)}
#dgw{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:13;align-items:center;justify-content:center}
#dgw>div{background:var(--card);padding:18px;border-radius:12px;display:flex;flex-direction:column;gap:12px;width:min(380px,92%)}
#act{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:11;align-items:flex-end;justify-content:center}
#act>div{background:var(--card);width:min(420px,100%);border-radius:14px 14px 0 0;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#act button{background:var(--inp);color:var(--text);text-align:left;border-radius:10px}
#act #adel{color:#dc2626}
#img{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:12;align-items:center;justify-content:center}
#img img{max-width:100%;max-height:100%;object-fit:contain}
</style></head><body>

<div id="login">
  <h2 style="margin:0">💬 Our Chat</h2>
  <div id="ld" style="color:var(--mute)">ஏற்றுகிறது...</div>
  <div id="lf">
    <input id="em" type="email" placeholder="Gmail" autocomplete="username">

<div id="chat">
  <header>
    <div class="av" id="av">💬</div>
    <div class="ti"><span id="fn">Our Chat</span><small id="sub">private chat</small></div>
    <b id="dg" title="சோதனை">🩺</b><b id="cpk" title="Password மாற்று">🔑</b><b id="bell" title="Notification">🔔</b><b id="call" title="Video call">📞</b><b id="out" title="வெளியேறு">⎋</b>
  </header>
  <div id="msgs"></div>

    <button id="at" title="படம்">📎</button>

</div>

<div id="sch"><div><b>⏰ எப்போது அனுப்ப வேண்டும்?</b><input id="sdt" type="datetime-local"><div style="display:flex;gap:8px"><button id="sx" style="flex:1;background:#6b7c85">ரத்து</button><button id="sok" style="flex:1">அமை</button></div></div></div>

<input id="c0" type="password" placeholder="பழைய password" autocomplete="current-password">
<input id="c1" type="password" placeholder="புதிய password (குறைந்தது 8)" autocomplete="new-password">
<input id="c2" type="password" placeholder="மீண்டும் புதிய password" autocomplete="new-password">

<div style="display:flex;gap:8px"><button id="cx" style="flex:1;background:#6b7c85">ரத்து</button><button id="cok" style="flex:1">மாற்று</button></div></div></div>

<div id="dgw"><div><b>🩺 சோதனை</b>
<div id="dgo" style="font-size:14px;line-height:1.55;white-space:pre-wrap;max-height:55vh;overflow:auto"></div>
<div style="display:flex;gap:8px"><button id="dgx" style="flex:1;background:#6b7c85">மூடு</button><button id="dgt" style="flex:1">🔔 சோதனை push</button></div></div></div>

<div id="act"><div>
  <button id="arp">↩ பதில்</button>
  <button id="acp">📋 நகலெடு</button>
  <button id="adel">🗑 நீக்கு</button>

</div></div>

<div id="img"><img id="big" alt=""></div>

<div id="vid">
  <video id="rv" autoplay playsinline></video>
  <div id="st" style="position:absolute;left:10px;top:10px;color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:8px"></div>
  <video id="lv" autoplay playsinline muted></video>
  <div id="ctl"><button id="mute">🎤</button><button id="cam">📷</button><button id="hang" class="red">❌ முடி</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===================== அமைப்புகள் (இவை மட்டும் மாற்றினால் போதும்) =====================
// Firebase web config ரகசியம் அல்ல (அனுமதி Firestore rules-ல் தான் உள்ளது).
const firebaseConfig = {
  apiKey: "AIzaSyA4jxhq4Du8RzcNbINAJOSIIV1tPTOX24o",
  authDomain: "our-chat-57278.firebaseapp.com",
  projectId: "our-chat-57278",
  storageBucket: "our-chat-57278.firebasestorage.app",
  messagingSenderId: "296738950584",
  appId: "1:296738950584:web:6d573663597aabfb3ed34d"
};
// keygen.html தந்த புதிய PUBLIC key இங்கே (private key இங்கே வைக்கவே கூடாது!)
const VAPID_PUB = "PASTE_NEW_VAPID_PUBLIC_KEY_HERE";
const WORKER_URL = "https://ourchat-push.gnanasekar308.workers.dev";
const MIN_PW = 8;
// ===================================================================================

const $ = id => document.getElementById(id);
const LS = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
const FV = firebase.firestore.FieldValue, TS = firebase.firestore.Timestamp;
const DAY = 864e5;

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
db.settings({experimentalAutoDetectLongPolling:true, merge:true});
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const room = db.collection('rooms').doc('main');
const callDoc = room.collection('calls').doc('current');
let me, myEmail, name, started = false;

let spMode = 'link', resetMode = LS.get('rs') === '1'; LS.set('rs','0');
const EP = firebase.auth.EmailAuthProvider;
const PERS = firebase.auth.Auth.Persistence;
function show(id){ $('ld').style.display=id==='ld'?'block':'none'; $('lf').style.display=id==='lf'?'flex':'none'; $('sp').style.display=id==='sp'?'flex':'none' }

// ---------- Login ----------
// எந்த password-ஐயும் வைக்கலாம்: அதிலிருந்து வலுவான key உருவாக்கி Firebase-க்கு அனுப்பப்படும்
async function dk(pw,email){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('ourchat:'+email.toLowerCase()),iterations:100000},k,256);
  return btoa(String.fromCharCode(...new Uint8Array(bits))).replace(/[+/=]/g,'x');
}
// "நினைவில் வை" தேர்ந்தால் LOCAL, இல்லையென்றால் ஆப் மூடியதும் மீண்டும் password கேட்கும்
const remembered = () => LS.get('rem') === '1';
const applyPersistence = () => auth.setPersistence(remembered() ? PERS.LOCAL : PERS.SESSION).catch(()=>{});
applyPersistence();
$('rm').checked = remembered();
async function savePersistence(){ LS.set('rem', $('rm').checked ? '1' : '0'); await applyPersistence() }

const niceErr = c => ({
  'auth/invalid-credential':'Email அல்லது password தவறு. முதல் முறை என்றால் Google பொத்தானை அழுத்தவும்',
  'auth/wrong-password':'Email அல்லது password தவறு',
  'auth/user-not-found':'Email அல்லது password தவறு. முதல் முறை என்றால் Google பொத்தானை அழுத்தவும்',
  'auth/too-many-requests':'அதிக முயற்சிகள். சிறிது நேரம் கழித்து முயலவும்',
  'auth/network-request-failed':'Internet இல்லை',
  'auth/operation-not-allowed':'Firebase-ல் Email/Password ஆன் செய்யவில்லை'
}[c] || c);

async function gsign(reset){
  resetMode = reset; $('err').textContent='';
  await savePersistence();
  const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
  try{ await auth.signInWithPopup(p) }
  catch(e){
    // iPhone PWA போன்ற இடங்களில் popup தடுக்கப்பட்டால் redirect முறை
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code)){
      try{ LS.set('rs', reset?'1':'0'); await auth.signInWithRedirect(p); return }catch(x){ e = x }
    }
    resetMode=false; LS.set('rs','0');
    if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)) $('err').textContent=niceErr(e.code);
  }
}
$('go').onclick=()=>gsign(false);
$('fg').onclick=()=>gsign(true);
$('pl').onclick = async()=>{
  $('err').textContent=''; const e=$('em').value.trim().toLowerCase(), p=$('pw').value;
  if(!e||!p){ $('err').textContent='Email, password இரண்டும் வேண்டும்'; return }
  try{ await savePersistence(); await auth.signInWithEmailAndPassword(e,await dk(p,e)); LS.set('em',e) }
  catch(x){ $('err').textContent = niceErr(x.code) }
};
$('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('pl').click() });

$('ps').onclick = async()=>{
  const u=auth.currentUser, a=$('p1').value, b=$('p2').value;
  if(a.length<MIN_PW){ $('err').textContent='குறைந்தது '+MIN_PW+' எழுத்துகள் வேண்டும்'; return }
  if(a!==b){ $('err').textContent='இரண்டும் ஒன்றாக இல்லை'; return }
  try{
    const k=await dk(a,u.email);
    if(spMode==='reset') await u.updatePassword(k); else await u.linkWithCredential(EP.credential(u.email,k));
    LS.set('em',u.email); resetMode=false; enter(auth.currentUser);
  }catch(e){
    if(e.code==='auth/requires-recent-login'){ $('err').textContent='மீண்டும் Google மூலம் உள்நுழையுங்கள்'; auth.signOut() }
    else $('err').textContent = niceErr(e.code)
  }
};
$('out').onclick = ()=>auth.signOut().then(()=>location.reload());
$('bell').onclick = ()=>enablePush(false);

// ---------- Password மாற்று ----------
$('cpk').onclick=()=>{ ['c0','c1','c2'].forEach(i=>$(i).value=''); $('cerr').textContent=''; $('cpw').style.display='flex' };
$('cx').onclick=()=>{ $('cpw').style.display='none' };
$('cok').onclick=async()=>{
  const u=auth.currentUser, o=$('c0').value, n=$('c1').value, m=$('c2').value;
  if(!o){ $('cerr').textContent='பழைய password உள்ளிடுங்கள்'; return }
  if(n.length<MIN_PW){ $('cerr').textContent='புதியது குறைந்தது '+MIN_PW+' எழுத்துகள்'; return }
  if(n!==m){ $('cerr').textContent='புதியது இரண்டும் ஒன்றாக இல்லை'; return }
  try{
    await u.reauthenticateWithCredential(EP.credential(u.email,await dk(o,u.email)));
    await u.updatePassword(await dk(n,u.email));
    $('cpw').style.display='none'; alert('✅ Password மாற்றப்பட்டது');
  }catch(e){ $('cerr').textContent = ['auth/invalid-credential','auth/wrong-password'].includes(e.code) ? 'பழைய password தவறு' : niceErr(e.code) }
};

// ---------- உள்ளே நுழைதல் ----------
// அனுமதி சரிபார்ப்பு: Firestore rules தான் உண்மையான பூட்டு. அனுமதி இல்லாத கணக்கு இங்கே நிற்கும்.
async function gate(){
  try{ await room.get({source:'server'}) }
  catch(e){
    if(e.code==='permission-denied'){
      $('err').textContent='இந்த கணக்கிற்கு அனுமதி இல்லை'; show('lf'); await auth.signOut(); return false;
    }
  }
  return true;
}
function enter(u){
  if(started) return; started = true;
  me = u.uid; myEmail = u.email; name = (u.displayName||u.email).split(' ')[0];
  $('login').style.display='none'; $('chat').style.display='flex';
  startChat(); startCalls(); enablePush(true);
}
auth.onAuthStateChanged(async u=>{
  if(!u){ show('lf'); $('em').value=LS.get('em')||''; return }
  if(!(await gate())) return;
  const hasPw=u.providerData.some(p=>p.providerId==='password');
  if(resetMode||!hasPw){
    spMode=resetMode?'reset':'link';
    $('spt').textContent=resetMode?'புதிய password அமைக்கவும்':'முதல் முறை: ஒரு password அமைக்கவும் (குறைந்தது '+MIN_PW+' எழுத்துகள்). அடுத்த முறை இதையே பயன்படுத்துவீர்கள்.';
    $('err').textContent=''; show('sp'); return;
  }
  LS.set('em',u.email); enter(u);
});

// ---------- Chat ----------
let curDocs=[], sig='', otherSeen=0, otherTyping=0, mySeen=0, lastTy=0, replyTo=null, actMsg=null;
const vis=(x,n)=>x.ms>n-DAY && !(x.sched&&x.uid!==me&&x.ms>n);
const okImg = s => typeof s==='string' && s.startsWith('data:image/');

function tick(){ const n=Date.now(), v=curDocs.filter(x=>vis(x,n)); const s=v.length+':'+v.filter(x=>x.sched&&x.ms>n).length; if(s!==sig) draw(curDocs) }
function hdr(){ $('sub').textContent = Date.now()-otherTyping<6000 ? 'தட்டச்சு செய்கிறார்...' : 'private chat' }

// காலாவதியான (exp) செய்திகளை அழி — Firestore TTL இல்லாவிட்டாலும் இது வேலை செய்யும்
async function cleanup(){
  try{
    const s=await room.collection('messages').where('exp','<',TS.fromMillis(Date.now()-120000)).limit(400).get();
    if(s.empty) return; const b=db.batch(); s.docs.forEach(d=>b.delete(d.ref)); await b.commit();
  }catch(e){}
}

function markSeen(){
  if(!started || document.visibilityState!=='visible') return;
  const n=Date.now(); let m=0;
  curDocs.forEach(x=>{ if(x.uid!==me && vis(x,n) && x.ms<=n && x.ms>m) m=x.ms });
  if(m>mySeen){ mySeen=m; room.set({seen:{[me]:m}},{merge:true}).catch(()=>{}) }
}

function draw(all){
  curDocs=all; const n=Date.now(), box=$('msgs');
  const stick = !box.firstChild || box.scrollHeight-box.scrollTop-box.clientHeight<140;
  box.textContent=''; let last='';
  const docs=all.filter(x=>vis(x,n));
  sig=docs.length+':'+docs.filter(x=>x.sched&&x.ms>n).length;
  docs.forEach(x=>{
    const d=new Date(x.ms), day=d.toDateString(), fut=x.sched&&x.ms>n;
    if(day!==last){ last=day; const p=document.createElement('div'); p.className='dt'; p.textContent=day===new Date().toDateString()?'இன்று':d.toLocaleDateString('ta-IN',{day:'numeric',month:'short',year:'numeric'}); box.appendChild(p) }
    const el=document.createElement('div'); el.className='m'+(x.uid===me?' me':'')+(fut?' sd':'');
    if(x.reply){
      const q=document.createElement('div'); q.className='rq';
      const qb=document.createElement('b'); qb.textContent=x.reply.n||'';
      q.append(qb, document.createTextNode(x.reply.t||'')); el.appendChild(q);
    }
    if(okImg(x.img)){
      const im=document.createElement('img'); im.className='pic'; im.src=x.img; im.alt='படம்';
      im.onclick=e=>{ e.stopPropagation(); $('big').src=x.img; $('img').style.display='flex' };
      im.onload=()=>{ if(stick) box.scrollTop=box.scrollHeight };
      el.appendChild(im);
    } else if(x.hasImg){
      const ph=document.createElement('div'); ph.className='ph'; ph.textContent='📷 படம் (ஏற்றுகிறது...)'; el.appendChild(ph);
    }
    if(x.text){ const b=document.createElement('div'); b.textContent=x.text; el.appendChild(b) }
    const t=document.createElement('div'); t.className='tm';
    const ts=document.createElement('span');
    ts.textContent=fut?('⏰ '+d.toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})):d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    t.appendChild(ts);
    if(x.uid===me && !fut){
      const st=document.createElement('span');
      if(x.pending){ st.className='dot '+(navigator.onLine?'yellow':'red'); st.title=navigator.onLine?'அனுப்பிக்கொண்டிருக்கிறது...':'அனுப்பப்படவில்லை — network இல்லை' }
      else if(x.ms<=otherSeen){ st.className='tk seen'; st.textContent='✓✓'; st.title='பார்த்தார்' }
      else { st.className='tk'; st.textContent='✓'; st.title='அனுப்பப்பட்டது' }
      t.appendChild(st);
    }
    el.appendChild(t);
    el.onclick=()=>openAct(x);
    box.appendChild(el);
  });
  const o=[...docs].reverse().find(x=>x.uid!==me&&x.name);
  if(o){ $('fn').textContent=o.name; $('av').textContent=o.name[0].toUpperCase(); LS.set('friend',o.name) }
  if(stick) box.scrollTop=box.scrollHeight;
  markSeen();
}

function startChat(){
  cleanup(); setInterval(cleanup,600000); setInterval(tick,5000); setInterval(hdr,2000);
  document.addEventListener('visibilitychange',markSeen);
  const key='cache3_'+me; const f=LS.get('friend'); if(f){$('fn').textContent=f;$('av').textContent=f[0].toUpperCase()}
  try{ draw(JSON.parse(LS.get(key)||'[]')) }catch(e){}

  // மற்றவர் "பார்த்தார்" / "தட்டச்சு" நிலை
  room.onSnapshot(s=>{
    const d=s.data()||{};
    const other=m=>Math.max(0,...Object.entries(m||{}).filter(([k])=>k!==me).map(([,v])=>Number(v)||0));
    otherTyping=other(d.typing); hdr();
    const sn=other(d.seen);
    if(sn!==otherSeen){ otherSeen=sn; if(curDocs.length) draw(curDocs) }
  });

  room.collection('messages').orderBy('ts').limitToLast(300).onSnapshot(s=>{
    const docs=s.docs.map(d=>{
      const x=d.data({serverTimestamps:'estimate'});
      return {id:d.id,uid:x.uid,name:x.name,text:x.text||'',img:x.img||'',reply:x.reply||null,sched:!!x.sched,
              ms:x.ts?x.ts.toMillis():Date.now(),pending:d.metadata.hasPendingWrites};
    });
    draw(docs);
    // படங்களை cache-ல் சேமிக்காதே (இடம் அதிகம்)
    LS.set(key, JSON.stringify(docs.slice(-200).map(x=>({...x,img:'',hasImg:!!x.img}))));
  });
}

// ---------- Push ----------
async function authedPost(body){
  const tok=await auth.currentUser.getIdToken();
  const r=await fetch(WORKER_URL,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(body)});
  let j={}; try{ j=await r.json() }catch(e){}
  return {r,j};
}
async function ping(at){
  if(!WORKER_URL) return;
  try{
    const s=await room.collection('subs').get(); const list=[];
    s.forEach(d=>{ if(d.id!==myEmail) ((d.data()||{}).eps||[]).forEach(ep=>list.push({id:d.id,ep})) });
    if(!list.length){ if(at) alert('⚠️ மற்றவர் 🔔 அழுத்தி Allow கொடுக்கவில்லை. அதனால் நேரத்தில் notification வராது.'); return }
    const {r,j}=await authedPost({action:'push',endpoints:list.map(x=>x.ep),at:at||0});
    if(at && !j.queued) alert('⚠️ Schedule server பிழை: '+(j.error||r.status));
    // காலாவதியான subscription-களை நீக்கு
    (j.res||[]).forEach((st,i)=>{ if(st===404||st===410) room.collection('subs').doc(list[i].id).update({eps:FV.arrayRemove(list[i].ep)}).catch(()=>{}) });
  }catch(e){ if(at) alert('⚠️ Schedule அனுப்ப முடியவில்லை: '+e.message) }
}
const u8=b=>{const p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function enablePush(quiet){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){ if(!quiet) alert('இந்த browser push ஆதரிக்கவில்லை'); return }
  if(Notification.permission!=='granted'){ if(quiet) return; if(await Notification.requestPermission()!=='granted'){ alert('Notification அனுமதி வேண்டும்'); return } }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub&&LS.get('vapid')!==VAPID_PUB){ await sub.unsubscribe(); sub=null }
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID_PUB)});
    LS.set('vapid',VAPID_PUB);
    await room.collection('subs').doc(myEmail).set({eps:FV.arrayUnion(sub.endpoint)},{merge:true});
    if(!quiet) alert('✅ Notification ஆன் ஆனது');
  }catch(e){ if(!quiet) alert('Push பிழை: '+e.message) }
}

function post(o,at){
  const base=at||Date.now();
  const doc={uid:me,name,text:'',...o,
    ts: at?TS.fromMillis(at):FV.serverTimestamp(),
    exp: TS.fromMillis(base+DAY)};            // 24 மணி நேரம் கழித்து தானாக அழியும்
  if(at) doc.sched=true;
  if(replyTo){ doc.reply={n:replyTo.uid===me?'நீங்கள்':(replyTo.name||''),t:(replyTo.text||'📷 படம்').slice(0,80)}; clearReply() }
  room.collection('messages').add(doc).catch(e=>alert('அனுப்ப முடியவில்லை: '+e.code));
  room.set({typing:{[me]:0}},{merge:true}).catch(()=>{});
  ping(at||0);
}

  try{ post({img:await shrink(f),text:''}) }catch(e){ alert('படத்தை அனுப்ப முடியவில்லை') }
};
function shrink(file){
  return new Promise((ok,no)=>{
    const im=new Image(), u=URL.createObjectURL(file);
    im.onload=()=>{
      URL.revokeObjectURL(u); let max=1000, q=.72;
      for(let i=0;i<6;i++){
        const k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const out=c.toDataURL('image/jpeg',q);
        if(out.length<300000) return ok(out);
        max*=.8; q-=.08;
      }
      no(new Error('big'));
    };
    im.onerror=no; im.src=u;
  });
}

// ---------- Video call (WebRTC, signaling = Firestore) ----------
let pc=null, stream=null, callId=null, unsubIce=null, pending=null, queue=[], busy=false, iceCache=null, iceAt=0, noAns=null;
async function getIce(){
  const base=[{urls:'stun:stun.l.google.com:19302'}];
  if(iceCache && Date.now()-iceAt<6e5) return iceCache;
  try{
    const {j}=await authedPost({action:'turn'});
    if(j.iceServers && j.iceServers.length){ iceCache=base.concat(j.iceServers); iceAt=Date.now(); return iceCache }
  }catch(e){}
  return base;
}
async function media(){
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
  $('lv').srcObject=stream; $('vid').style.display='flex';
  $('mute').textContent='🎤'; $('cam').textContent='📷';
}
function addC(c){ pc.remoteDescription ? pc.addIceCandidate(c).catch(()=>{}) : queue.push(c) }
function flush(){ queue.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{})) }
function newPC(ice){
  pc = new RTCPeerConnection({iceServers:ice}); queue=[];
  const cid=callId;
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack = e=>{ $('rv').srcObject = e.streams[0] };
  pc.onicecandidate = e=>{ if(e.candidate) room.collection('ice').add({callId:cid,from:me,c:JSON.stringify(e.candidate),exp:TS.fromMillis(Date.now()+36e5)}) };
  pc.oniceconnectionstatechange = ()=>{ if(pc){ $('st').textContent='நிலை: '+pc.iceConnectionState; if(pc.iceConnectionState==='connected'||pc.iceConnectionState==='completed'){ clearTimeout(noAns) } } };
  pc.onconnectionstatechange = ()=>{ if(pc && pc.connectionState==='failed') alert('இணைப்பு தோல்வி. TURN server அமைக்கப்பட்டுள்ளதா என சரிபார்க்கவும்.') };
  unsubIce = room.collection('ice').where('callId','==',cid).onSnapshot(s=>s.docChanges().forEach(ch=>{
    if(ch.type==='added'){ const d=ch.doc.data(); if(d.from!==me && pc) addC(JSON.parse(d.c)) }
  }));
}
function end(del){
  ring(false); clearTimeout(noAns); busy=false;
  const cid=callId;
  if(unsubIce){unsubIce();unsubIce=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(pc){pc.close();pc=null}
  $('vid').style.display='none'; $('rv').srcObject=null; $('inc').style.display='none';
  if(del){
    callDoc.delete().catch(()=>{});
    if(cid) room.collection('ice').where('callId','==',cid).get().then(s=>s.forEach(d=>d.ref.delete())).catch(()=>{});
  }
}
async function call(){
  if(busy) return; busy=true;
  try{ await media() }catch(e){ busy=false; alert('Camera/mic பிழை: '+e.name+' — அனுமதி கொடுங்கள்'); return }
  try{
    callId = String(Date.now()); newPC(await getIce()); $('st').textContent='அழைக்கிறது...';
    const o = await pc.createOffer(); await pc.setLocalDescription(o);
    await callDoc.set({callId,from:me,fromName:name,offer:{type:o.type,sdp:o.sdp},answer:null});
    ping(0);
    noAns=setTimeout(()=>{ if(pc && !pc.remoteDescription){ alert('பதில் இல்லை'); end(true) } },45000);
  }catch(e){ alert('அழைப்பு தொடங்க முடியவில்லை: '+(e.code||e.message)); end(true) }
}
async function accept(){
  const d=pending; ring(false); $('inc').style.display='none'; busy=true;
  try{ await media() }catch(e){ busy=false; alert('Camera/mic பிழை: '+e.name+' — அனுமதி கொடுங்கள்'); return }
  try{
    callId=d.callId; newPC(await getIce());
    await pc.setRemoteDescription(d.offer); flush();
    const a = await pc.createAnswer(); await pc.setLocalDescription(a);
    await callDoc.update({answer:{type:a.type,sdp:a.sdp}});
  }catch(e){ alert('அழைப்பை ஏற்க முடியவில்லை: '+(e.code||e.message)); end(false) }
}
// அழைப்பு மணி
let ac=null, ringT=null, ringStop=null;
function ring(on){
  clearInterval(ringT); clearTimeout(ringStop); ringT=null;
  if(!on){ if(navigator.vibrate) navigator.vibrate(0); return }
  const beep=()=>{
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();
      const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; g.gain.value=.15;
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+.35);
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([300,150,300]);
  };
  beep(); ringT=setInterval(beep,1500);
  ringStop=setTimeout(()=>{ ring(false); if(!pc) $('inc').style.display='none' },45000);
}
function startCalls(){
  callDoc.onSnapshot(s=>{
    const d=s.data();
    if(!d){ ring(false); $('inc').style.display='none'; if(pc) end(false); return }
    if(d.from===me){
      if(d.answer && pc && !pc.remoteDescription) pc.setRemoteDescription(d.answer).then(flush);
    }else if(!d.answer && !pc && !busy && Date.now()-Number(d.callId)<60000){
      pending=d; $('who').textContent='📞 '+d.fromName+' அழைக்கிறார்'; $('inc').style.display='flex'; ring(true);
    }else if(d.answer && !pc){ ring(false); $('inc').style.display='none' }
  });
}
$('call').onclick=call; $('acc').onclick=accept;
$('dec').onclick=()=>{ ring(false); $('inc').style.display='none'; callDoc.delete().catch(()=>{}) };
$('hang').onclick=()=>end(true);
$('mute').onclick=()=>{ const t=stream&&stream.getAudioTracks()[0]; if(t){ t.enabled=!t.enabled; $('mute').textContent=t.enabled?'🎤':'🔇' } };
$('cam').onclick=()=>{ const t=stream&&stream.getVideoTracks()[0]; if(t){ t.enabled=!t.enabled; $('cam').textContent=t.enabled?'📷':'🚫' } };

async function runDiag(){
  const out=$('dgo'); out.textContent=''; let bad=0;

  L(!!auth.currentUser,'Login: '+(myEmail||'இல்லை'));
  try{ await room.get({source:'server'}); L(true,'Firestore படிக்க முடிகிறது') }
  catch(e){ L(false,'Firestore படிக்க முடியவில்லை ('+e.code+')','Rules-ல் உங்கள் Gmail சரியா? Publish செய்தீர்களா?') }
  try{ await room.set({diag:{[me]:Date.now()}},{merge:true}); L(true,'Firestore எழுத முடிகிறது') }
  catch(e){ L(false,'Firestore எழுத முடியவில்லை ('+e.code+')','firestore.rules சரிபார்') }
  const pubOk=/^[A-Za-z0-9_-]{87}$/.test(VAPID_PUB);
  L(pubOk,'index.html-ல் VAPID_PUB அமைக்கப்பட்டுள்ளது','keygen-ன் Public key-ஐ index.html-ல் வை');
  let st=null;
  try{
    const {r,j}=await authedPost({action:'status'});
    if(r.status===401) L(false,'Worker: அனுமதி மறுப்பு (401)','Worker-ல் MEMBERS, FIREBASE_PROJECT சரிபார்');
    else if(!j.ok) L(false,'Worker பதில் சரியில்லை ('+r.status+')','Worker-ல் புதிய worker.js Deploy செய்தீர்களா?');
    else { st=j; L(true,'Worker இணைந்தது, உங்கள் login ஏற்கப்பட்டது') }
  }catch(e){ L(false,'Worker-ஐ அடைய முடியவில்லை','WORKER_URL சரியா? ALLOWED_ORIGIN = https://gnanasekar308.github.io (கடைசியில் / இல்லாமல்)') }
  if(st){
    L(st.vapidKeysMatch,'Worker-ன் VAPID keys ஜோடி சரி','VAPID_PRIVATE மற்றும் VAPID_PUBLIC ஒரே keygen ஜோடியாக இருக்க வேண்டும்');
    L(st.vapidPublic===VAPID_PUB,'Worker public key = index.html public key','இரண்டிலும் ஒரே Public key வை');
    L(st.kv,'KV (SCHED) இணைந்துள்ளது','Worker → Bindings → KV namespace → பெயர் SCHED');
    L(st.members>=2,'MEMBERS-ல் '+st.members+' முகவரிகள்','MEMBERS-ல் இருவரின் Gmail கமாவால் பிரித்து');
    out.textContent+=(st.turn?'✅ ':'ℹ️ ')+(st.turn?'TURN உள்ளது (4G call-க்கு நல்லது)':'TURN இல்லை (Wi-Fi call வேலை செய்யும்; 4G-ல் சிக்கலாகலாம்)')+'\n';
  }
  L(!!navigator.serviceWorker&&!!navigator.serviceWorker.controller,'Service worker இயங்குகிறது','ஆப்பை மூடி மீண்டும் திற');
  if(!('PushManager' in window)) L(false,'இந்த browser push ஆதரிக்கவில்லை','iPhone என்றால் Home Screen-ல் சேர்த்து அங்கிருந்து திற');
  else{
    L(Notification.permission==='granted','Notification அனுமதி: '+Notification.permission,'🔔 அழுத்தி Allow கொடு');
    try{
      const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription();
      L(!!sub,'இந்த சாதனத்தின் push subscription உள்ளது','🔔 அழுத்து');
      if(sub){ const d=await room.collection('subs').doc(myEmail).get(); L(((d.data()||{}).eps||[]).includes(sub.endpoint),'Subscription Firestore-ல் சேமிக்கப்பட்டது','🔔 அழுத்து') }
    }catch(e){ L(false,'Push சோதனை பிழை: '+e.message) }
  }
  try{
    const s=await room.collection('subs').get(); let other=0; s.forEach(d=>{ if(d.id!==myEmail&&((d.data()||{}).eps||[]).length) other++ });
    out.textContent+=(other?'✅ ':'⚠️ ')+(other?'மற்றவரின் சாதனம் notification-க்குத் தயார்':'மற்றவர் இன்னும் 🔔 அழுத்தவில்லை (அவர் phone-ல் செய்ய வேண்டும்)')+'\n';
  }catch(e){}
  out.textContent+='\n'+(bad?('❌ '+bad+' சிக்கல்(கள்). மேலே 👉 குறிப்புகளைப் பார்.'):'🎉 எல்லாம் சரி!');
}
$('dg').onclick=()=>{ $('dgw').style.display='flex'; runDiag() };
$('dgx').onclick=()=>{ $('dgw').style.display='none' };
$('dgt').onclick=async()=>{
  try{
    const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription();
    if(!sub){ alert('முதலில் 🔔 அழுத்தி Allow கொடுங்கள்'); return }
    const {j}=await authedPost({action:'push',endpoints:[sub.endpoint],at:0});
    const s=(j.res||[])[0];
    alert(s===201?'✅ Push server ஏற்றுக்கொண்டது (201). ஆப்பை மூடிவிட்டுப் பாருங்கள்; சில நொடிகளில் notification வரும்.':'❌ Push தோல்வி: '+(s===undefined?(j.error||'பதில் இல்லை'):s)+' — 🔔 மீண்டும் அழுத்தி முயலுங்கள்');
  }catch(e){ alert('❌ '+e.message) }
};

// ---------- Service worker ----------
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(had) navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!pc) location.reload() });
}

window.addEventListener('offline',()=>draw(curDocs));
